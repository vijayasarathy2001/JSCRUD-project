<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Employees</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 40px;
    }

    .heading {
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .input-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 200px;
      max-width: 320px;
    }

    label {
      font-size: 14px;
      margin-bottom: 8px;
    }

    input {
      background-color: transparent;
      border: 1px solid #707070;
      border-radius: 4px;
      color: #ffffff;
      padding: 10px;
      font-size: 14px;
      outline: none;
    }

    .add-btn {
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 2px;
      padding: 10px 30px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .delete-btn {
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 20px;
      padding: 8px 20px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .message {
      font-size: 15px;
      margin-bottom: 20px;
    }

    .error-msg {
      color: #ff4d4d;
    }

    .success-msg {
      color: #00ff66;
    }

    .empty-text {
      font-size: 15px;
      opacity: 0.8;
    }

    .employee-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 520px;
    }

    .employee-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #707070;
      border-radius: 4px;
      padding: 12px 16px;
      flex: 1;
      font-size: 14px;
    }

    .emp-number {
      margin-right: 10px;
    }
  </style>
</head>
<body>

  <h2 class="heading">New Employees</h2>

  <form id="employeeForm" onsubmit="event.preventDefault();">
    <div class="form-group">
      <div class="input-container">
        <label for="name">Enter Name</label>
        <input type="text" id="name" />
      </div>

      <div class="input-container">
        <label for="profession">Enter Profession</label>
        <input type="text" id="profession" />
      </div>

      <div class="input-container">
        <label for="age">Enter Age</label>
        <input type="number" id="age" />
      </div>
    </div>

    <button type="button" class="add-btn" id="addUserBtn">Add User</button>
  </form>

  <div id="messageContainer" class="message"></div>

  <h2 class="heading" style="margin-top: 40px;">Added Employees</h2>
  <div id="employeeContainer">
    <p class="empty-text">You have 0 Employees.</p>
  </div>

  <script>
    const nameInput = document.getElementById('name');
    const professionInput = document.getElementById('profession');
    const ageInput = document.getElementById('age');
    const addUserBtn = document.getElementById('addUserBtn');
    const messageContainer = document.getElementById('messageContainer');
    const employeeContainer = document.getElementById('employeeContainer');

    let employees = [];

    addUserBtn.addEventListener('click', () => {
      const name = nameInput.value.trim();
      const profession = professionInput.value.trim();
      const age = ageInput.value.trim();

      if (!name || !profession || !age) {
        messageContainer.className = 'message error-msg';
        messageContainer.textContent = 'Error : Please Make sure All the fields are filled before adding in an employee !';
        return;
      }

      const newEmployee = {
        id: Date.now(),
        name,
        profession,
        age
      };
      employees.push(newEmployee);

      messageContainer.className = 'message success-msg';
      messageContainer.textContent = 'Success : Employee Added!';

      nameInput.value = '';
      professionInput.value = '';
      ageInput.value = '';

      renderEmployees();
    });

    function deleteUser(id) {
      employees = employees.filter(emp => emp.id !== id);
      renderEmployees();
    }

    function renderEmployees() {
      if (employees.length === 0) {
        employeeContainer.innerHTML = '<p class="empty-text">You have 0 Employees.</p>';
        return;
      }

      const listHtml = `
        <div class="employee-list">
          ${employees.map((emp, index) => `
            <div class="employee-row">
              <div class="card">
                <div><span class="emp-number">${index + 1}.</span> Name : ${emp.name}</div>
                <div>Profession: ${emp.profession}</div>
                <div>Age:${emp.age}</div>
              </div>
              <button class="delete-btn" onclick="deleteUser(${emp.id})">Delete User</button>
            </div>
          `).join('')}
        </div>
      `;

      employeeContainer.innerHTML = listHtml;
    }
  </script>
</body>
</html>
